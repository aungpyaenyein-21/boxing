<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Boxing</title>
<style>
  body { margin:0; background:#111; color:#eee; font:13px/1.5 monospace; overflow:hidden }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
         align-items:flex-start; padding:12px 16px; z-index:2; pointer-events:none }
  .side { width:34% }
  .name { margin-bottom:4px; text-shadow:0 1px 2px #000 }
  #hudB { text-align:right }
  .bar { height:12px; background:#0006; border:1px solid #000a; margin-bottom:4px }
  .bar div { height:100%; width:100% }
  .hp div { background:#c33 }
  .st div { background:#dbA33a }
  #hudB .bar div { margin-left:auto }
  #center { text-align:center; text-shadow:0 1px 2px #000 }
  #clock { font-size:22px }
  #msg { position:fixed; top:38%; width:100%; text-align:center; font-size:34px;
         text-shadow:0 2px 6px #000; z-index:2; pointer-events:none }
  #help { position:fixed; bottom:10px; width:100%; text-align:center; color:#aaa;
          text-shadow:0 1px 2px #000; z-index:2 }
</style>
</head>
<body>
<div id="hud">
  <div class="side" id="hudA">
    <div class="name">YOU</div>
    <div class="bar hp"><div></div></div>
    <div class="bar st"><div></div></div>
  </div>
  <div id="center"><div id="round"></div><div id="clock"></div></div>
  <div class="side" id="hudB">
    <div class="name">CPU</div>
    <div class="bar hp"><div></div></div>
    <div class="bar st"><div></div></div>
  </div>
</div>
<div id="msg">loading...</div>
<div id="help">A/D move &nbsp; S guard &nbsp; W lean &nbsp; &larr;/&rarr; jab &nbsp; Space+&larr;/&rarr; hook &nbsp; R restart</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
}}
</script>
<script type="module" src="./game.js?v=2"></script>
</body>
</html>
